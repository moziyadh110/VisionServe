# Full local stack: docker compose up -d --build
# Only the services, for running the API on the host: docker compose up -d postgres redis storage

x-db-url: &db-url postgresql+asyncpg://visionserve:${POSTGRES_PASSWORD:-visionserve}@postgres:5432/visionserve

services:
  api:
    build: .
    image: visionserve-api
    env_file:
      - path: .env
        required: false
    # These win over .env: inside the compose network, services are reached by name.
    environment:
      DATABASE_URL: *db-url
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://storage:9000
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    restart: unless-stopped

  # One-shot job: apply database migrations, then exit. The API waits for it.
  migrate:
    build: .
    image: visionserve-api  # same image as the API; the build is cached, so it's built once
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: *db-url
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: visionserve
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visionserve}
      POSTGRES_DB: visionserve
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visionserve -d visionserve"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    # S3-compatible object store for local dev (a MinIO drop-in; MinIO's images
    # were removed from Docker Hub). In the cloud, real S3 replaces it.
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - storagedata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  storagedata:
  hf_cache:
