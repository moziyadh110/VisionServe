# Full local stack: docker compose up -d --build
# Only Postgres/Redis/MinIO for running the API on the host: docker compose up -d postgres redis minio

x-db-url: &db-url postgresql+asyncpg://visionserve:${POSTGRES_PASSWORD:-visionserve}@postgres:5432/visionserve

services:
  api:
    build: .
    image: visionserve-api
    env_file:
      - path: .env
        required: false
    # These win over .env: inside the compose network, services are reached by name.
    environment:
      DATABASE_URL: *db-url
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # One-shot job: apply database migrations, then exit. The API waits for it.
  migrate:
    build: .
    image: visionserve-api  # same image as the API; the build is cached, so it's built once
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: *db-url
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: visionserve
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visionserve}
      POSTGRES_DB: visionserve
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visionserve -d visionserve"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # MinIO no longer publishes new free images; this pinned release still pulls.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  miniodata:
  hf_cache:
