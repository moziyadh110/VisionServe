services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: visionserve
      POSTGRES_PASSWORD: visionserve
      POSTGRES_DB: visionserve
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visionserve -d visionserve"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
