[project]
name = "visionserve"
version = "0.1.0"
description = "GPU-backed image captioning and OCR API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "email-validator>=2.1",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "boto3>=1.34",
    "redis>=5.0",
    "structlog>=24.1",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
# The real model stack. Kept optional so tests and CI run without torch or a GPU.
# Install with: uv sync --extra ml
ml = [
    "torch>=2.4",
    # Florence-2's remote code breaks on transformers >= 4.50, so stay below it.
    "transformers>=4.45,<4.50",
    "einops>=0.8",
    "timm>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "fakeredis[lua]>=2.23",
    "ruff>=0.6",
]
# Load testing: uv sync --group loadtest
loadtest = [
    "locust>=2.29",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Header() defaults are the intended pattern.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.File"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
# Plain `pytest` (and CI) runs only fast tests that need no GPU or services.
addopts = "-m 'not gpu and not integration'"
markers = [
    "gpu: loads the real Florence-2 model (run locally: pytest -m gpu)",
    "integration: needs docker compose services (run: pytest -m integration)",
]
